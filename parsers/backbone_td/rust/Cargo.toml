[package]
# We name the package `src` so that things like logging have the right
# logging target.
name = "src"
# dummy version. See pyproject.toml for the src's version number.
version = "1.2.2"
edition = "2021"
rust-version = "1.82.0"

[lib]
name = "src"
# We generate a `cdylib` for Python and a standard `lib` for running
# tests/benchmarks.
crate-type = ["lib", "cdylib"]

# This is deprecated, see tool.maturin in pyproject.toml.
# It is left here for compatibility with maturin < 0.15.
[package.metadata.maturin]
# This is where we tell maturin where to place the built library.
name = "src.src_rust"

[dependencies]
ahash = "0.8.11"
clap = "4.5.20"
lazy_static = "1.4.0"
mdbook = "0.4.40"
pcap = "2.2.0"
pnet = "0.35.0"
pyo3 = { version = "0.22.6", features = ["auto-initialize"] }
pyo3-log = "0.11.0"
log = "0.4.17"
rand = { version = "0.8.5", features = ["small_rng"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0"
priority-queue = "2.1.1"
fern = "0.7.0"
chrono = "0.4.38"
csv = "1.3.1"
regex = "1.11.1"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[build-dependencies]
blake2 = "0.10.4"
hex = "0.4.3"

[dev-dependencies]
criterion = "0.5.1"
rand_distr = "0.4.3"
zipf = "7.0.1"
